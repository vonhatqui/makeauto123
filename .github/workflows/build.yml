name: Build iOS Dynamic Library

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Cho phép bạn bấm nút kích hoạt biên dịch thủ công trên giao diện web GitHub

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
    # Bước 1: Lấy mã nguồn từ Repository
    - name: Checkout repository
      uses: actions/checkout@v4aaaaaaaaaaa

    # Bước 2: Thiết lập Xcode môi trường phát triển chính thức của Apple
    - name: Select Xcode version
      run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

    # Bước 3: Biên dịch file mã nguồn IPAAntiBanSecurity.m thành dylib
    - name: Compile Dynamic Library
      run: |
        # Tìm kiếm vị trí thực tế của file IPAAntiBanSecurity.m trong repository
        TARGET_FILE=$(find . -name "IPAAntiBanSecurity.m" -print -quit)
        if [ -z "$TARGET_FILE" ]; then
          echo "❌ Lỗi: Không tìm thấy file IPAAntiBanSecurity.m trong repository!"
          exit 1
        fi
        echo "Found target file at: $TARGET_FILE"
        
        xcrun -sdk iphoneos clang -dynamiclib -arch arm64 -miphoneos-version-min=12.0 \
        -framework Foundation -framework UIKit \
        "$TARGET_FILE" -o IPAAntiBanSecurity.dylib

    # Bước 4: Tải tệp sản phẩm dylib lên Artifact để bạn tải xuống
    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: IPAAntiBanSecurity-Dylib
        path: IPAAntiBanSecurity.dylib
